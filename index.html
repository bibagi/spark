<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
  <!-- ЭКРАН ВХОДА / ЛОББИ -->
  <div id="lobby-screen" class="screen active">
    <div class="lobby-card">
      <div class="brand">
        <div class="logo-spark">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </div>
        <h1>Spark</h1>
      </div>
      <p class="tagline"></p>

      <form id="join-form" class="join-form">
        <div class="input-group">
          <label for="username-input">Имя или никнейм</label>
          <input type="text" id="username-input" placeholder="Введите имя" maxlength="25" required autocomplete="off" />
        </div>

        <div class="input-group">
          <label for="room-input">Комната</label>
          <div class="room-input-row">
            <input type="text" id="room-input" placeholder="Название комнаты" maxlength="30" required autocomplete="off" />
            <button type="button" id="random-room-btn" class="btn btn-secondary" title="Сгенерировать случайное название">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"></circle>
                <circle cx="15.5" cy="15.5" r="1.5" fill="currentColor"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Превью камеры в лобби -->
        <div class="media-preview-container">
          <video id="lobby-video-preview" autoplay playsinline muted></video>
          <div class="preview-overlay" id="lobby-avatar-fallback">
            <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <div class="lobby-controls">
            <button type="button" id="lobby-toggle-mic" class="circle-btn" title="Микрофон">
              <svg class="icon-mic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
              </svg>
            </button>
            <button type="button" id="lobby-toggle-cam" class="circle-btn" title="Камера">
              <svg class="icon-cam" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="23 7 16 12 23 17 23 7"></polygon>
                <rect x="1" y="5" width="15" height="14" rx="3" ry="3"></rect>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          <span>Присоединиться</span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <!-- ЭКРАН КОМНАТЫ / ЗВОНКА -->
  <div id="room-screen" class="screen">
    <!-- Верхняя панель -->
    <header class="top-bar">
      <div class="brand-small">
        <div class="logo-spark small">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </div>
        <span class="brand-title">Spark</span>
      </div>

      <div class="room-info-pill">
        <span class="live-dot"></span>
        <span class="room-name" id="current-room-name">Комната</span>
        <button id="copy-link-btn" class="pill-btn" title="Скопировать ссылку">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
          <span id="copy-btn-text">Ссылка</span>
        </button>
      </div>

      <div class="top-actions">
        <button id="toggle-chat-panel-btn" class="icon-btn active" title="Чат">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <span class="badge" id="chat-unread-badge" style="display: none;">0</span>
        </button>
      </div>
    </header>

    <!-- Основное пространство звонка + чат -->
    <main class="main-room-layout">
      <!-- Сетка видео/участников -->
      <section class="video-stage">
        <div id="video-grid" class="video-grid single-user">
          <!-- Локальный пользователь -->
          <div class="video-card local" id="local-video-card">
            <video id="local-video" autoplay playsinline muted></video>
            <div class="avatar-fallback" id="local-avatar-fallback">
              <span id="local-avatar-letter">Me</span>
            </div>
            <div class="participant-badge">
              <span id="local-participant-name">Вы</span>
              <div class="participant-indicators">
                <span class="indicator mic-off" id="local-mic-indicator" style="display: none;">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                    <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>
                    <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path>
                    <line x1="12" y1="19" x2="12" y2="23"></line>
                    <line x1="8" y1="23" x2="16" y2="23"></line>
                  </svg>
                </span>
              </div>
            </div>
          </div>
        </div>

        <div id="reactions-container" class="reactions-floating"></div>
      </section>

      <!-- Панель чата -->
      <aside class="chat-panel" id="chat-panel">
        <div class="chat-header">
          <h3>Чат</h3>
          <span class="chat-users-count" id="users-count-label">1 участник</span>
        </div>

        <div class="chat-messages" id="chat-messages">
          <!-- Сообщения -->
        </div>

        <form id="chat-form" class="chat-form">
          <input type="text" id="chat-input" placeholder="Сообщение или ссылка..." autocomplete="off" />
          <button type="submit" class="chat-send-btn" title="Отправить">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>
      </aside>
    </main>

    <!-- Нижняя панель управления звонком -->
    <footer class="call-controls-dock">
      <div class="controls-group">
        <button id="toggle-mic-btn" class="control-btn" title="Микрофон">
          <svg class="icon-mic" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
          <span>Микрофон</span>
        </button>

        <button id="toggle-cam-btn" class="control-btn" title="Камера">
          <svg class="icon-cam" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="23 7 16 12 23 17 23 7"></polygon>
            <rect x="1" y="5" width="15" height="14" rx="3" ry="3"></rect>
          </svg>
          <span>Камера</span>
        </button>

        <button id="toggle-screen-btn" class="control-btn" title="Экран">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
          <span>Экран</span>
        </button>

        <button id="leave-room-btn" class="control-btn danger" title="Выйти">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Выйти</span>
        </button>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
